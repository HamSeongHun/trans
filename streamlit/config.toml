[theme]
primaryColor = "#4F6BED"
font = "sans serif"

[theme.light]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6FA"
textColor = "#2F2D2B"

[theme.dark]
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1D26"
textColor = "#FAFAFA"

[server]
headless = true

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
